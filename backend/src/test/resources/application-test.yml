# The mock OTP provider is what makes these tests possible without an SMS account:
# the test reads the generated code straight from the repository instead of a phone.
app:
  otp:
    provider: mock
    # The 45-second resend cooldown is a production concern; here it would only make every test
    # sleep. Rate limiting is covered by its own focused test rather than by every flow.
    resend-cooldown: PT0S
  jwt:
    secret: test-only-secret-value-that-is-long-enough-for-hmac-sha256

  rate-limit:
    # Off by default here. Every integration test signs several accounts in from 127.0.0.1 within
    # a second or two, which is exactly the pattern the limiter exists to stop — leaving it on
    # would make unrelated tests fail intermittently as they grew.
    #
    # AuthRateLimitIT turns it back on with a deliberately tiny allowance, so the behaviour is
    # still proved over HTTP rather than only in the unit test.
    enabled: false
    auth-requests-per-minute: 60

logging:
  level:
    com.allgos.dms: INFO
    org.testcontainers: WARN
