services:
  postgres:
    image: postgres:16-alpine
    container_name: allgos-postgres
    environment:
      POSTGRES_DB: allgos_dms
      POSTGRES_USER: allgos
      POSTGRES_PASSWORD: allgos
    ports:
      # Published on 5433 so it coexists with a PostgreSQL installed directly on the machine,
      # which owns 5432. Without this, "localhost:5432" resolves to the local server and the
      # application fails to authenticate against a database that does not have its schema.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allgos -d allgos_dms"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: allgos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      # Published on 9002 because Windows commonly reserves 9001 (see
      # `netsh interface ipv4 show excludedportrange protocol=tcp`), which makes the
      # bind fail outright. The container still serves the console on 9001 internally.
      - "9002:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # creates the documents bucket once MinIO is up, then exits
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/allgos-documents &&
      echo 'bucket ready'
      "

volumes:
  postgres-data:
  minio-data:
